<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="从 Bills 账本读取每日净支出，用蓝色热力图看见钱的节律与异常。" />
    <title>Flux · 支出热力图</title>
    <script>
      try {
        const today = new Date().toISOString().slice(0, 10)
        const override = JSON.parse(localStorage.getItem('flux-theme-override') || 'null')
        document.documentElement.dataset.theme = override?.date === today
          ? override.theme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
